[workspace]
resolver = "3"
members = ["crates/vigie-probe", "crates/vigie-core", "crates/vigie-app", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
authors = ["Evan Pluchart"]
repository = "https://github.com/EvanPluchart/vigie"

[workspace.dependencies]
vigie-probe = { path = "crates/vigie-probe" }
vigie-core = { path = "crates/vigie-core" }

# Slint is pinned to an exact version and upgraded only on purpose (decision 0001).
slint = "=1.18.1"
slint-build = "=1.18.1"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
flume = "=0.12.0"
anyhow = "=1.0.104"
thiserror = "=2.0.21"
