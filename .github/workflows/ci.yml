name: CI

# Pull requests and pushes to main, and by hand. Pushes to dev stay manual, to save GitHub
# Actions minutes (the author's choice during development).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Slint's Linux dependencies
        if: runner.os == 'Linux'
        # Same list as Slint's own CI (.github/actions/install-linux-dependencies).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libudev-dev libinput-dev libgbm-dev \
            libfontconfig-dev libseat-dev libsystemd-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  budget:
    # The performance budget (docs/ARCHITECTURE.md) is defined on an idle machine; a shared
    # runner is not one, so this reports without failing the run.
    name: budget (windows)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask bench-overhead --seconds=30 --check
