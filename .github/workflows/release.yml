name: Release

# Builds the packages of decision 0009. On a `v*` tag it also drafts a GitHub release with them;
# otherwise (release-check branch, by hand) it only uploads them as workflow artifacts.
on:
  push:
    tags: ["v*"]
    # A dry run without publishing: push a commit to this branch (manual dispatch only works
    # once the workflow is on the default branch).
    branches: [release-check]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Secrets cannot appear in step conditions: their presence goes through the environment.
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Inno Setup (pinned; 6.7.1 is the newest on Chocolatey)
        run: choco install innosetup --version=6.7.1 -y --no-progress
      - name: Build the installer and the portable zip
        run: cargo xtask dist
      - name: Sign (only when a certificate is configured)
        if: env.HAS_WINDOWS_CERT == 'true'
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          Get-ChildItem dist\*.exe | ForEach-Object {
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $_.FullName
          }
      - uses: actions/upload-artifact@v4
        with:
          name: vigie-windows
          path: |
            dist/*-setup.exe
            dist/*-portable.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the .dmg (signed and notarised when the secrets exist, ad hoc otherwise)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash packaging/macos/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vigie-macos
          path: dist/*.dmg

  linux:
    # The oldest supported distribution: the AppImage runs on newer ones, not the reverse.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Slint's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libudev-dev libinput-dev libgbm-dev \
            libfontconfig-dev libseat-dev libsystemd-dev libwayland-dev file desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the AppImage
        run: bash packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vigie-linux
          path: dist/*.AppImage

  draft:
    # Only for tags: a draft release, published by hand after checking it.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "Vigie ${GITHUB_REF_NAME#v}" \
            --notes "Unsigned builds unless stated otherwise: Windows SmartScreen and macOS Gatekeeper warn on first launch."
