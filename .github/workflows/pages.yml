name: Pages

# Publishes site/ to GitHub Pages. By hand only: Actions minutes are counted.
# Needs Pages enabled with "GitHub Actions" as the source (Settings > Pages); on a free plan the
# repository must be public. Manual runs need this file on the default branch.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
